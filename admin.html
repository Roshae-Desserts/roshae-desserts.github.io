<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Roshae admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Josefin+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">
<section id="login" class="login">
  <form id="loginForm">
    <img src="images/logo.png" alt="Roshae" height="48">
    <h1>Orders</h1>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <p id="loginErr" class="lerr" role="alert"></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
</section>

<div id="app" hidden>
  <header class="abar">
    <strong>Roshae orders</strong>
    <div><button class="btn alt" id="refresh">Refresh</button> <button class="btn alt" id="csv">Export CSV</button> <button class="btn alt" id="out">Sign out</button></div>
  </header>
  <main class="awrap">
    <div class="filters">
      <label>Dates by <select id="basis"><option value="delivery">Delivery date</option><option value="created">Order date</option></select></label>
      <label>Range <select id="range"><option value="all">All time</option><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="week">This week</option><option value="month">This month</option><option value="custom">Custom</option></select></label>
      <span id="custom" hidden><input type="date" id="from" aria-label="From"> <input type="date" id="to" aria-label="To"></span>
      <input id="q" type="search" placeholder="Search name, phone, order no.">
      <label class="chk"><input type="checkbox" id="unpaid"> Unpaid only</label>
    </div>
    <div class="summary" id="summary"></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
